<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="elaraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e0c3fc" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow circle -->
  <circle cx="100" cy="100" r="70" fill="url(#elaraGrad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Outer Orbit Ring -->
  <ellipse cx="100" cy="100" rx="82" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-28 100 100)" stroke-dasharray="8 6"/>
  
  <!-- Central Sphere -->
  <circle cx="100" cy="100" r="48" fill="url(#elaraGrad)" filter="url(#glow)"/>
  
  <!-- Inner Star / Core Symbol -->
  <polygon points="100,68 108,92 132,100 108,108 100,132 92,108 68,100 92,92" fill="#ffffff" opacity="0.95"/>
  
  <!-- Orbiting Satellite Dot -->
  <circle cx="168" cy="72" r="6" fill="#00f2fe" filter="url(#glow)"/>
</svg>
